services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray
    ports:
      - "443:443"
    volumes:
      - ./config/config.json:/etc/xray/config.json:ro
    command: ["-config", "/etc/xray/config.json"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.core.somaxconn: "8192"
      net.ipv4.tcp_fastopen: "3"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
